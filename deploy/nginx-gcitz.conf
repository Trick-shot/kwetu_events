server {
    listen 80;
    listen [::]:80;
    server_name gcitz.org www.gcitz.org;

    root /var/www/projects/kwetu_events/frontend/dist;
    index index.html;

    # SPA routing — BrowserRouter deep links fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets: long cache (Vite hashes filenames)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Phase 2 (Django API via Gunicorn):
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}
